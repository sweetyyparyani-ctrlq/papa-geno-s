<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a2818" />
      <stop offset="70%" stop-color="#2c170d" />
      <stop offset="100%" stop-color="#190c06" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe69a" />
      <stop offset="35%" stop-color="#dfa745" />
      <stop offset="70%" stop-color="#fdf0cd" />
      <stop offset="100%" stop-color="#aa771c" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b" />
      <stop offset="50%" stop-color="#c92a2a" />
      <stop offset="100%" stop-color="#801010" />
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5e6d3" />
    </linearGradient>
    <!-- Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring Base -->
  <circle cx="250" cy="250" r="235" fill="url(#bgGlow)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)" />
  
  <!-- Decorative Beaded Ring -->
  <circle cx="250" cy="250" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="3, 7" stroke-linecap="round" />
  <circle cx="250" cy="250" r="208" fill="none" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Inner Dark Chocolate Shield -->
  <circle cx="250" cy="250" r="195" fill="#201008" stroke="#3d2012" stroke-width="4" />

  <!-- Circular Text Path for Brand Name -->
  <path id="textPathTop" d="M 95 250 A 155 155 0 0 1 405 250" fill="none" />
  <text font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="34" font-weight="900" fill="url(#goldGrad)" letter-spacing="6">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      PAPA GENO'S
    </textPath>
  </text>

  <!-- Circular Text Path for Subtitle -->
  <path id="textPathBottom" d="M 405 250 A 155 155 0 0 1 95 250" fill="none" />
  <text font-family="'Montserrat', 'Arial', sans-serif" font-size="14" font-weight="700" fill="#f5e6d3" letter-spacing="7">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      • LUXURY RESTAURANT &amp; GRILL •
    </textPath>
  </text>

  <!-- Center Artwork Group -->
  <g transform="translate(250, 245)" filter="url(#shadow)">
    <!-- Crossed Pizza Peel & Skewer/Fork in Gold -->
    <path d="M-65 -45 L50 65" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <path d="M-65 -45 L-45 -65 L-20 -40 L-40 -20 Z" fill="url(#goldGrad)" />
    
    <path d="M65 -45 L-50 65" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <!-- Fork Prongs -->
    <path d="M65 -45 L75 -55 M60 -50 L70 -60 M55 -45 L65 -65" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Royal Chef Hat (Crown-toque Hybrid) -->
    <path d="M-40 -15 C-55 -40, -35 -75, -15 -65 C-10 -85, 10 -85, 15 -65 C35 -75, 55 -40, 40 -15 Z" fill="url(#creamGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Hat Fold Details -->
    <path d="M-15 -65 C-8 -40, -10 -20, -12 -15" stroke="#d5bfa7" stroke-width="2" fill="none" />
    <path d="M0 -75 C0 -45, 0 -25, 0 -15" stroke="#d5bfa7" stroke-width="2" fill="none" />
    <path d="M15 -65 C8 -40, 10 -20, 12 -15" stroke="#d5bfa7" stroke-width="2" fill="none" />
    <!-- Hat Band -->
    <rect x="-35" y="-15" width="70" height="14" rx="3" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Mini Gold Star on Band -->
    <polygon points="0,-12 2,-7 7,-7 3,-4 5,1 0,-2 -5,1 -3,-4 -7,-7 -2,-7" fill="url(#goldGrad)" />

    <!-- Flame / Gourmet Emblem underneath -->
    <path d="M0 5 C15 15, 20 30, 0 45 C-20 30, -15 15, 0 5 Z" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="2" />
    <path d="M0 15 C8 22, 8 32, 0 38 C-8 32, -8 22, 0 15 Z" fill="#ffb830" />

    <!-- Five Stars in Arch Above Chef Hat -->
    <g transform="translate(0, -95)">
      <polygon points="0,-8 2,-2 8,-2 3,2 5,8 0,4 -5,8 -3,2 -8,-2 -2,-2" fill="url(#goldGrad)" />
      <polygon points="-24,-3 -22,2 -16,2 -21,6 -19,12 -24,8 -29,12 -27,6 -32,2 -26,2" fill="url(#goldGrad)" transform="scale(0.85)" />
      <polygon points="24,-3 26,2 32,2 27,6 29,12 24,8 19,12 21,6 16,2 22,2" fill="url(#goldGrad)" transform="scale(0.85)" />
      <polygon points="-50,8 -48,13 -42,13 -47,17 -45,23 -50,19 -55,23 -53,17 -58,13 -52,13" fill="url(#goldGrad)" transform="scale(0.7)" />
      <polygon points="50,8 52,13 58,13 53,17 55,23 50,19 45,23 47,17 42,13 48,13" fill="url(#goldGrad)" transform="scale(0.7)" />
    </g>
  </g>

  <!-- Red Premium Ribbon Banner across Bottom -->
  <g transform="translate(250, 375)" filter="url(#shadow)">
    <!-- Ribbon Tails -->
    <path d="M-190 5 L-225 -15 L-210 25 L-225 45 L-170 30 Z" fill="#6d0a0a" stroke="#aa771c" stroke-width="2" />
    <path d="M190 5 L225 -15 L210 25 L225 45 L170 30 Z" fill="#6d0a0a" stroke="#aa771c" stroke-width="2" />
    
    <!-- Main Ribbon Arc -->
    <path d="M-180 5 C-80 -8, 80 -8, 180 5 L170 35 C75 22, -75 22, -170 35 Z" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    
    <!-- Ribbon Text -->
    <text x="0" y="22" font-family="'Montserrat', 'Cinzel', sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">
      PIZZAS • BURGERS • WRAPS &amp; GRILL
    </text>
  </g>

  <!-- Established Date Badges -->
  <g fill="url(#goldGrad)" font-family="'Cinzel', serif" font-size="13" font-weight="700">
    <text x="90" y="255" text-anchor="middle">EST.</text>
    <text x="410" y="255" text-anchor="middle">2024</text>
  </g>
</svg>
